<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>telegram-loader — media</title>
    <!-- wasm-bindgen emits `memory.copy`, so wasm-opt has to be told that bulk
         memory is allowed or it fails validation on a release build. -->
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory-opt --enable-nontrapping-float-to-int"
    />
    <link data-trunk rel="css" href="../../assets/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📼</text></svg>"
    />
  </head>
  <body>
    <noscript>This gallery needs JavaScript (WebAssembly) enabled.</noscript>
  </body>
</html>
