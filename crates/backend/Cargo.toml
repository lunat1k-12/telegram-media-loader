[package]
name = "backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "telegram-loader"
path = "src/main.rs"

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

# `rustls` instead of the default `native-tls`: no OpenSSL, so the Linux build is
# a single static binary that runs on any distro. See README.md.
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
# Only for the file-download client in bot.rs. Its features unify with
# teloxide's (`rustls`), so this does not pull in a second TLS stack.
reqwest = { version = "0.12", default-features = false }
pretty_env_logger = "0.5"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "process", "sync", "time"] }
axum = { version = "0.8", features = ["multipart", "http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header", "compression-gzip", "compression-br"] }
mime_guess = "2"
futures-util = "0.3"

# Smart-plug control for charger.rs / plug.rs (Tuya local protocol 3.5). All
# pure Rust, so the static musl build is unaffected.
aes-gcm = "0.10"
anyhow = "1"
hmac = "0.12"
rand = "0.9"
sha2 = "0.10"
